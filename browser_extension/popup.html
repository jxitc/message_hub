<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="utf-8">
    <style>
        body { font-family: system-ui, -apple-system, sans-serif; width: 300px; margin: 0; padding: 14px; color: #222; }
        h1 { font-size: 14px; margin: 0 0 8px; }
        textarea { width: 100%; height: 90px; padding: 8px; font-size: 13px; box-sizing: border-box;
                   border: 1px solid #ccc; border-radius: 6px; resize: vertical; }
        button { margin-top: 8px; padding: 7px 12px; font-size: 13px; border-radius: 6px;
                 border: 1px solid #0d6efd; background: #0d6efd; color: #fff; cursor: pointer; width: 100%; }
        button.secondary { background: #f6f6f6; color: #333; border-color: #ccc; margin-top: 6px; }
        #status { font-size: 12px; margin-top: 8px; white-space: pre-wrap; color: #666; }
        .bad { color: #dc3545; }
        .ok { color: #198754; }
    </style>
</head>
<body>
    <h1>Message Hub</h1>
    <textarea id="note" placeholder="随手记一条…（也可以直接在网页上划选文字后右键）"></textarea>
    <button id="save">保存</button>
    <button class="secondary" id="options">设置</button>
    <div id="status"></div>
    <script src="popup.js"></script>
</body>
</html>
